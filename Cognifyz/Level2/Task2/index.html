<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Grid Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container my-5">
    <h2 class="text-center mb-4">Responsive Grid Layout</h2>
    <div class="row g-4">
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="grid-item" style="background-color:red">Red</div>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="grid-item" style="background-color:blue">Blue</div>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="grid-item" style="background-color:green">Green</div>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="grid-item" style="background-color:yellow">Yellow</div>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="grid-item" style="background-color:grey">Grey</div>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="grid-item" style="background-color:pink">Pink</div>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="grid-item" style="background-color:black">Black</div>
      </div>
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="grid-item" style="background-color:orange">Orange</div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
