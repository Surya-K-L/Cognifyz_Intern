<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>

    <img src="images\image12.jfif" alt="Image 12">
    <img src="images\image13.jfif" alt="Image 13">

</html>
